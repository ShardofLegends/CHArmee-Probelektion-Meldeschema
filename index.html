<!DOCTYPE html>
<html>
<head>
    <title>Random Image</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #000000;
        }

        .frame {
            width: min(80vw, 100%);
            aspect-ratio: 4 / 3;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .frame img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Show entire image */
        }
    </style>
</head>
<body>

<div class="frame">
    <img id="randomImage" alt="Random Image">
</div>

<script>
    const images = [
        "images/image1.png",
        "images/image2.jpg",
        "images/image3.png",
        "images/image4.jpg",
        "images/image5.png",
        "images/image6.jpg",
        "images/image7.jpg",
        "images/image8.jpg"
    ];

    const randomIndex = Math.floor(Math.random() * images.length);
    document.getElementById("randomImage").src = images[randomIndex];
</script>

</body>
</html>
